version: "3.8"
services:
  quash:
    container_name: quash
    restart: always
    build: .
    env_file: .env
    ports:
      - ${PORT}:${PORT}
    depends_on:
      - postgres
    volumes:
      - .:/usr/src/app

  postgres:
    container_name: postgres
    image: postgres:10.4
    hostname: postgres
    env_file: .env
    ports:
      - "5432:${DB_PORT}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
  pgadmin:
    container_name: container-pgadmin
    image: dpage/pgadmin4:4.18
    env_file: .env
    depends_on:
      - postgres
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
    restart: unless-stopped

volumes:
  postgres-data:
